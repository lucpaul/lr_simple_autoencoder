[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lr-unet-autoencoder"
version = "0.1.0"
description = "Simple 3-level UNet autoencoder for LR image-to-image reconstruction"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.2",
  "torchvision>=0.17",
  "numpy>=1.24",
  "PyYAML>=6.0",
  "tifffile>=2024.2.12",
  "tqdm>=4.66",
  "jupyter>=1.1.1",
]

[project.optional-dependencies]
notebook = [
  "jupyter>=1.0.0",
  "matplotlib>=3.8",
]

[project.scripts]
ae-train = "lr_autoencoder.train:main"
ae-infer = "lr_autoencoder.infer:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
